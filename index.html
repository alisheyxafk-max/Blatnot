<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f6f6b">
<link rel="manifest" href="manifest.json">
<title>Bloknot</title>
<style>
:root{--bg:#f6f3ee;--surface:#fffdf9;--ink:#1d2a2a;--muted:#6d7a78;--line:#e2ddd3;--accent:#1f6f6b;--accent-ink:#fff;--danger:#b4412f;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root{--bg:#141a1a;--surface:#1c2424;--ink:#e8efee;--muted:#8fa09d;--line:#2b3636;--accent:#5fc2bb;--accent-ink:#0c1a19;--danger:#e8806c}}
*{box-sizing:border-box}
html{height:100%}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font:17px/1.5 Georgia,"Times New Roman",serif}
header{position:sticky;top:0;background:var(--bg);padding:14px 16px 10px;z-index:5;border-bottom:1px solid var(--line)}
h1{margin:0 0 10px;font-size:26px;font-weight:700}
#q{width:100%;padding:11px 14px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);font:16px system-ui,sans-serif}
#q:focus,textarea:focus,input:focus{outline:2px solid var(--accent);outline-offset:1px}
main{padding:12px 16px 110px;max-width:640px;margin:0 auto}
.note{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:10px;cursor:pointer}
.note h2{margin:0 0 4px;font-size:18px}
.note p{margin:0;color:var(--muted);font:14px/1.45 system-ui,sans-serif;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;white-space:pre-wrap}
.note time{display:block;margin-top:8px;color:var(--muted);font:12px system-ui,sans-serif}
.empty{text-align:center;color:var(--muted);margin-top:60px;font-family:system-ui,sans-serif}
#add{position:fixed;right:18px;bottom:calc(18px + env(safe-area-inset-bottom,0px));width:58px;height:58px;border-radius:50%;border:0;background:var(--accent);color:var(--accent-ink);font-size:30px;line-height:1;cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,.25)}
#editor{position:fixed;inset:0;background:var(--bg);display:none;flex-direction:column;z-index:20;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
#editor.open{display:flex}
.bar{display:flex;gap:8px;align-items:center;padding:10px 12px;border-bottom:1px solid var(--line)}
.bar button{border:0;background:none;color:var(--accent);font:600 16px system-ui,sans-serif;padding:8px 10px;cursor:pointer;border-radius:8px}
.bar .del{color:var(--danger);margin-left:auto}
#title{border:0;background:none;color:var(--ink);font:700 24px Georgia,serif;padding:16px 16px 4px;width:100%}
#body{flex:1;border:0;background:none;color:var(--ink);font:17px/1.6 Georgia,serif;padding:8px 16px 16px;resize:none;width:100%}
#title::placeholder,#body::placeholder{color:var(--muted)}
</style>
</head>
<body>
<header>
  <h1>Bloknot</h1>
  <input id="q" type="search" placeholder="Qidirish" aria-label="Qidirish">
</header>
<main id="list"></main>
<button id="add" aria-label="Yangi qaydnoma">+</button>

<section id="editor" aria-label="Qaydnoma tahrirlash">
  <div class="bar">
    <button id="back">Saqlash va chiqish</button>
    <button id="del" class="del">O'chirish</button>
  </div>
  <input id="title" placeholder="Sarlavha" maxlength="120">
  <textarea id="body" placeholder="Yozishni boshlang..."></textarea>
</section>

<script>
(function(){
  var KEY="bloknot:notes", notes=[], current=null;
  var $=function(id){return document.getElementById(id)};
  function load(){try{notes=JSON.parse(localStorage.getItem(KEY)||"[]")}catch(e){notes=[]}}
  function save(){try{localStorage.setItem(KEY,JSON.stringify(notes))}catch(e){}}
  function fmt(t){return new Date(t).toLocaleString("uz-UZ",{day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"})}
  function esc(s){return s.replace(/[&<>]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;"}[c]})}
  function render(){
    var q=$("q").value.trim().toLowerCase();
    var items=notes.filter(function(n){return !q||(n.title+" "+n.body).toLowerCase().indexOf(q)>-1})
      .sort(function(a,b){return b.updated-a.updated});
    $("list").innerHTML=items.length?items.map(function(n){
      return '<div class="note" data-id="'+n.id+'"><h2>'+esc(n.title||"Nomsiz")+'</h2><p>'+esc(n.body||"")+'</p><time>'+fmt(n.updated)+'</time></div>'
    }).join(""):'<p class="empty">'+(q?"Hech narsa topilmadi.":"Hali qaydnoma yo'q. + tugmasini bosing.")+'</p>';
  }
  function open(n){
    current=n;$("title").value=n.title;$("body").value=n.body;
    $("editor").classList.add("open");
    if(!n.title&&!n.body)$("title").focus();
  }
  function close(){
    if(current){
      var t=$("title").value.trim(),b=$("body").value;
      if(!t&&!b.trim()){notes=notes.filter(function(x){return x.id!==current.id})}
      else{current.title=t;current.body=b;current.updated=Date.now()}
      save();
    }
    current=null;$("editor").classList.remove("open");render();
  }
  $("add").onclick=function(){var n={id:String(Date.now()),title:"",body:"",updated:Date.now()};notes.push(n);open(n)};
  $("back").onclick=close;
  $("del").onclick=function(){
    if(!current)return;
    if(confirm("Bu qaydnomani o'chirasizmi?")){notes=notes.filter(function(x){return x.id!==current.id});current=null;save();$("editor").classList.remove("open");render()}
  };
  $("list").onclick=function(e){
    var el=e.target.closest(".note");if(!el)return;
    var n=notes.filter(function(x){return x.id===el.dataset.id})[0];if(n)open(n);
  };
  $("q").oninput=render;
  load();render();
  if("serviceWorker" in navigator){navigator.serviceWorker.register("sw.js").catch(function(){})}
})();
</script>
</body>
</html>
